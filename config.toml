# Tunable parameters. Secrets go in .env, not here.

[llm]
provider = "anthropic"        # anthropic | openai
name = "claude-sonnet-4-6"    
max_tokens = 1024
temperature = 0.1
# top_p = 0.95

[agent]
max_steps = 6
default_language = "es"       # the UI toggle overrides this per request

[db]
path = "./.data/orders.db"

[rag]
kb_root = "SaborMix"
collection = "sabormix"
persist_dir = "./.data/chroma"
embedding_model = "text-embedding-3-small"
top_k = 6